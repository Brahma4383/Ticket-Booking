# One grouped pull request per ecosystem per week for minor and patch bumps; majors arrive on their own.
version: 2

updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch
    # Django stays on 6.0 until the MySQL server is on 8.4 (6.1 requires it),
    # so only patch releases are offered; the bump to 6.1 is a deliberate
    # change made by hand together with the MySQL upgrade.
    ignore:
      - dependency-name: django
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
