<!--
  SuryaBooker tab icon.

  The square reduction of the ticket mark in src/components/Logo.tsx. A tab
  renders this at 16px, where the stub's notches and perforation collapse into
  a smudge, so what is left is what survives at that size: the gold sun, its
  rays, and the wing sweeping out beneath it, on a brand chip.

  Colours are literal rather than brand custom properties, because a favicon
  is painted outside the page and inherits none of its CSS. They are
  brand-600, brand-800 and accent-400 from src/index.css; change them
  together. The chip is deliberately the deeper end of the brand ramp: gold on
  a mid orange is about 1.9:1 and the sun vanishes.

  Note for editors: an XML comment may not contain two hyphens in a row, so
  custom properties cannot be named in here. An invalid comment silently
  breaks the whole file and the browser falls back to a blank icon.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cb4a0a" />
      <stop offset="100%" stop-color="#8a3010" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#chip)" />

  <circle cx="16" cy="12.5" r="4.6" fill="#fbc02d" />
  <path
    d="M16 6.3V4.1M19.8 7.6l1.4-1.7M12.2 7.6l-1.4-1.7M22 11l2.1-.5M10 11l-2.1-.5"
    stroke="#fbc02d"
    stroke-width="1.8"
    stroke-linecap="round"
  />

  <path fill="#fff" d="M6.5 24.5Q16 18.6 27 19.2Q16.5 22.8 7.2 26.8Z" />
</svg>
