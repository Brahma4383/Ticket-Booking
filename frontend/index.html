<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuryaBooker — Book buses, trains, flights, hotels and cabs</title>
    <meta
      name="description"
      content="Compare and book bus, train, flight, hotel and cab tickets in one place, with instant refunds and 24x7 support."
    />
    <script>
      // Applies the theme before first paint so dark mode never flashes white.
      // Mirrors resolveTheme() in src/utils/theme.ts.
      (function () {
        try {
          var saved = localStorage.getItem('suryabooker-theme')
          var dark =
            saved === 'dark' ||
            (saved !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
